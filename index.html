<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Courtside Padel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: club console. Sticky top bar + tab strip, one 1100px column; court cards drawn as mini padel courts. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F4F7FA; --ink:#0F1B2D; --muted:#5A6A7E; --line:#D6DEE8;
  --court:#1E5CB8; --court-soft:#E2EBF8; --court-ink:#FFFFFF; --court-fill:#2A66C2; --court-line:rgba(255,255,255,.55);
  --ball:#C9AF1F; --ball-soft:#F6EFC4; --ball-ink:#2E2800;
  --good:#1D7F55; --good-soft:#DDF1E7; --warn:#A5680F; --warn-soft:#F8EBD2; --bad:#B8362A; --bad-soft:#F8DEDA;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A111C; --surface:#121C2B; --surface-2:#172336; --ink:#E4EBF4; --muted:#91A1B5; --line:#243349;
  --court:#5B97F0; --court-soft:#16284A; --court-ink:#06101E; --court-fill:#1F4F92; --court-line:rgba(255,255,255,.4);
  --ball:#E2CC52; --ball-soft:#332D0C; --ball-ink:#1E1A00;
  --good:#45C28B; --good-soft:#12301F; --warn:#E5A84C; --warn-soft:#33250D; --bad:#F2705F; --bad-soft:#3A1713;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A111C; --surface:#121C2B; --surface-2:#172336; --ink:#E4EBF4; --muted:#91A1B5; --line:#243349;
  --court:#5B97F0; --court-soft:#16284A; --court-ink:#06101E; --court-fill:#1F4F92; --court-line:rgba(255,255,255,.4);
  --ball:#E2CC52; --ball-soft:#332D0C; --ball-ink:#1E1A00;
  --good:#45C28B; --good-soft:#12301F; --warn:#E5A84C; --warn-soft:#33250D; --bad:#F2705F; --bad-soft:#3A1713;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.1rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.85em}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.02em}
.brand svg{flex:none}
.tabs{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--court)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--court)}
.btn.primary{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--court);padding-inline:6px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:.78rem}
.check{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;cursor:pointer}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.court{background:var(--court-soft);border-color:transparent;color:var(--court)}
.chip.ball{background:var(--ball-soft);border-color:transparent;color:var(--ink)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

.banner{border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--ball-soft);color:var(--ink)}
.banner.info{background:var(--court-soft)}
.banner p{flex:1;min-width:200px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* rating hero */
.rating{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.big{font-family:var(--f-display);font-size:4.2rem;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.big small{font-size:1.2rem;color:var(--muted);font-weight:600}
.factors{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.factor{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.factor .v{font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.factor.accent{border-left-color:var(--court)}
.factor.ball{border-left-color:var(--ball)}

/* game cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.gcard:hover{border-color:var(--court)}
.gcard .when{font-family:var(--f-display);font-size:1.05rem;font-weight:600;color:var(--court)}

/* court */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.court{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.court-head{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:.8rem;font-weight:600}
.court-no{font-family:var(--f-display);font-size:1.1rem}
.court-body{position:relative;display:grid;grid-template-columns:1fr 6px 1fr;background:var(--court-fill);color:#fff;min-height:96px;
  background-image:linear-gradient(var(--court-line),var(--court-line)),linear-gradient(var(--court-line),var(--court-line)),linear-gradient(var(--court-line),var(--court-line));
  background-size:1.5px 100%,32% 1.5px,32% 1.5px;background-position:50% 0,14% 50%,86% 50%;background-repeat:no-repeat}
.court-body .side{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;font-weight:600;font-size:.9rem;min-width:0;position:relative}
.court-body .side span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.court-body select.slot{background:rgba(255,255,255,.16);color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:6px;font-weight:600;padding:2px 4px;width:100%;margin:1px 0}
.court-body select.slot option{color:#0F1B2D}
.court-body .side.b{text-align:right}
.court-body .avg{font-weight:400;font-size:.74rem;opacity:.85}
.court-body .net{background:repeating-linear-gradient(0deg,rgba(255,255,255,.85) 0 3px,transparent 3px 6px)}
.court-body .me{background:rgba(255,255,255,.18)}
.court-body .side.won{background:var(--ball);color:var(--ball-ink)}
.court-body .side.lost{opacity:.6}
.court-body .side .res{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.move{display:flex;justify-content:space-between;gap:8px;padding:0 12px 8px;font-size:.78rem;color:var(--muted)}
.medal{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-weight:700;font-size:.78rem;background:var(--surface-2);border:1px solid var(--line)}
.medal.m1{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
tr.lead td{background:var(--ball-soft)}
.court-foot{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px}
.court-foot input{width:64px;text-align:center;font-family:var(--f-display);font-size:1.2rem;font-weight:600;padding:3px}
.score{font-family:var(--f-display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.sitout{font-size:.85rem;color:var(--muted)}

/* timers */
.clock{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);min-width:160px}
.clock .t{font-family:var(--f-display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.clock.live{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.clock.live .eyebrow{color:var(--court-ink);opacity:.8}
.clock.over{background:var(--bad);border-color:var(--bad);color:#fff}
.clock.over .eyebrow{color:#fff}

.round{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.round:first-child{border-top:0;padding-top:0}

.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs .btn[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.M{background:var(--court)} .dot.F{background:var(--ball)} .dot.N{background:linear-gradient(90deg,var(--court) 50%,var(--ball) 50%)} .dot.mx{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--muted)}

.lvl{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.lvl button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:8px 0;font-family:var(--f-display);font-weight:700;font-size:1.1rem;cursor:pointer}
.lvl button[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.checks{display:flex;flex-direction:column;gap:6px}
.checkline{display:flex;gap:8px;align-items:center;font-size:.9rem}
.ok{color:var(--good);font-weight:700} .no{color:var(--bad);font-weight:700}

.modal-bg{position:fixed;inset:0;background:rgba(5,12,24,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg.mine{flex-direction:row-reverse}
.msg .bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;max-width:80%;min-width:0}
.msg.mine .bubble{background:var(--court-soft);border-color:transparent}
.msg .meta{font-size:.75rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}
.av{border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--court-soft);color:var(--court);font-weight:700;flex:none;vertical-align:middle}
.scorepad{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;grid-template-rows:auto 1fr 1fr auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));gap:10px}
@media (orientation:landscape){.scorepad{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto}.scorepad .sp-top,.scorepad .sp-bottom{grid-column:1/-1}}
.sp-top,.sp-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sp-side{border:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;color:#fff}
.sp-side.a{background:var(--court-fill)} .sp-side.b{background:var(--court)}
.sp-num{font-family:var(--f-display);font-size:clamp(4rem,22vw,9rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sp-names{font-weight:700;font-size:1.05rem;text-align:center;padding:0 10px} .sp-hint{font-size:.78rem;opacity:.8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:600}
.spark{display:block}
@media (prefers-reduced-motion:no-preference){.gcard,.btn{transition:border-color .15s}}
@media (max-width:520px){ .big{font-size:3.2rem} .rating{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
"use strict";
const CFG = window.COURTSIDE_CONFIG || {};
const ADMIN_EMAIL = "mink.sumana@gmail.com";
const ADMIN_EMAILS = (CFG.adminEmails && CFG.adminEmails.length ? CFG.adminEmails : [ADMIN_EMAIL]).map(e=>String(e).toLowerCase());
const COLS = ["locations","players","games","leagues","memberships","signups","settings","levels","organiser_requests","player_blocks","notices"];
const LEVELS = ["","New to padel","Beginner","Improving beginner","Lower intermediate","Intermediate","Upper intermediate","Advanced","Competitive","Elite amateur","Pro level"];
const PRI = {high:10, medium:3, off:0};
const SCALE = 4;             // a 4-level gap = ~91% expected win
const DEFAULT_SETTINGS = {membershipLive:false, price:120, trialDays:30, discounts:[]};

let sb = null, rafPending = false, liveChannel = null;
const S = {
  mode:"loading", dbAvailable:false, loaded:{},
  me:{id:null,name:"",email:null,isOwner:false},
  data:emptyData(),
  emails:{}, chat:{}, startedAt:Date.now(),
  ui:{tab:"home", loc:null, view:null, modal:null, draft:{}, scores:{}, adminTab:"members", confirm:null, toast:null}
};
function emptyData(){ const o={}; COLS.forEach(c=>o[c]={}); return o; }

/* ---------- utils ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const today = () => { const d=new Date(); return iso(d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (isoStr,n) => { const d=new Date(isoStr+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = s => { if(!s) return "—"; const d=new Date(s.length<=10? s+"T12:00:00": s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()!==new Date().getFullYear()? d.getFullYear():""}`.trim(); };
const fmtDT = ms => { if(!ms) return "—"; const d=new Date(ms); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const sign = (v,dp=2) => (v>=0?"+":"−") + Math.abs(v).toFixed(dp);
const money = v => "£" + (Math.round(v*100)/100).toLocaleString("en-GB",{minimumFractionDigits:0,maximumFractionDigits:2});
function shuffle(a, rnd=Math.random){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const clone = o => JSON.parse(JSON.stringify(o));
// Accepts 19:00, 19.00, 1900, 900, 9:5, 9 → "HH:MM" (24-hour); null if not a real time.
function normTime(v){ const t=String(v??"").trim().replace(/[.\sh]/g,":"); let h,m;
  if(/^\d{1,2}:\d{1,2}$/.test(t)) [h,m]=t.split(":").map(Number);
  else if(/^\d{3,4}$/.test(t)){ h=+t.slice(0,-2); m=+t.slice(-2); }
  else if(/^\d{1,2}$/.test(t)){ h=+t; m=0; } else return null;
  if(h>23||m>59) return null; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
const minutesBetween = (a,b) => { const x=normTime(a), y=normTime(b); if(!x||!y) return 0; const [h1,m1]=x.split(":").map(Number),[h2,m2]=y.split(":").map(Number); return (h2*60+m2)-(h1*60+m1); };
const toMs = (date,time) => new Date(`${date}T${time||"00:00"}:00`).getTime();
const pk = (a,b) => a<b ? a+"|"+b : b+"|"+a;

/* ---------- identity & roles ---------- */
const meId = () => S.mode==="sample" ? "me" : S.me.id;
// The database enforces admin rights from the same email list (app_admins); this only decides what to show.
const isAdmin = () => S.mode==="sample" || ADMIN_EMAILS.includes((S.me.email||"").toLowerCase());
const settings = () => ({...DEFAULT_SETTINGS, ...(S.data.settings.app||{})});
const locs = () => Object.values(S.data.locations).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const myPlayer = () => S.data.players[meId()];
function curLoc(){
  const all = locs(); if(!all.length) return null;
  const mine = myPlayer()?.locations || [];
  let id = S.ui.loc;
  if(!id || !S.data.locations[id]) id = mine.find(l=>S.data.locations[l]) || all[0].id;
  S.ui.loc = id; return S.data.locations[id];
}
const isOrganiser = (locId, pid=meId()) => (pid===meId() && isAdmin()) || (S.data.locations[locId]?.organiserIds||[]).includes(pid);

async function put(col,id,obj){
  obj = clone(obj);
  if(S.mode==="sample"){ S.data[col][id]=obj; schedule(); return true; }
  if(!sb||S.mode!=="live"){ toast("Sign in to save changes."); return false; }
  const prev=S.data[col][id];
  S.data[col][id]={...obj,id}; schedule();
  const {id:_drop,...data}=obj;
  const {error}=await sb.from(col).upsert({id, data});
  if(error){ if(prev) S.data[col][id]=prev; else delete S.data[col][id]; schedule(); toast(dbError(error)); return false; }
  return true;
}
async function remove(col,id){
  if(S.mode==="sample"){ delete S.data[col][id]; schedule(); return; }
  const prev=S.data[col][id]; delete S.data[col][id]; schedule();
  const {error}=await sb.from(col).delete().eq("id",id);
  if(error){ if(prev) S.data[col][id]=prev; schedule(); toast(dbError(error)); }
}
async function loadTable(col){
  const out={}; let from=0;
  for(;;){ const {data,error}=await sb.from(col).select("id,data").order("id").range(from,from+999);
    if(error) throw error; data.forEach(r=>{ out[r.id]={...(r.data||{}), id:r.id}; }); if(data.length<1000) break; from+=1000; }
  S.data[col]=out; S.loaded[col]=true;
}
// Optional tables (added after launch) load if present, so an older database still works.
const OPTIONAL_COLS = new Set(["organiser_requests","player_blocks","notices"]);
async function loadAll(){ await Promise.all(COLS.map(c=>loadTable(c).catch(e=>{ if(OPTIONAL_COLS.has(c)){ S.data[c]={}; S.loaded[c]=true; } else throw e; }))); if(isAdmin()) await loadEmails(); schedule(); }

let optChannel = null;
function subscribe(){
  if(liveChannel) sb.removeChannel(liveChannel);
  if(optChannel) sb.removeChannel(optChannel);
  let first=true;
  const onChange = col => p => {
    if(p.eventType==="DELETE"){ if(p.old?.id) delete S.data[col][p.old.id]; }
    else if(p.new?.id){ S.data[col][p.new.id]={...(p.new.data||{}), id:p.new.id};
      if(col==="notices" && p.eventType==="INSERT"){ const n=S.data.notices[p.new.id]; if(relevantNotice(n)) toast(noticeText(n)); } }
    schedule(); };
  liveChannel = sb.channel("courtside-live");
  COLS.filter(c=>!OPTIONAL_COLS.has(c)).forEach(col=>liveChannel.on("postgres_changes",{event:"*",schema:"public",table:col},onChange(col)));
  liveChannel.subscribe(status=>{
    if(status==="SUBSCRIBED"){ if(!first) loadAll().catch(()=>{}); first=false; }   // caught up after a reconnect
    if(status==="CHANNEL_ERROR"||status==="TIMED_OUT") toast("Live updates paused. They'll resume when the connection returns.");
  });
  // newer tables get their own channel, so a database without them can't stop the main live updates
  optChannel = sb.channel("courtside-live-extra");
  [...OPTIONAL_COLS].forEach(col=>optChannel.on("postgres_changes",{event:"*",schema:"public",table:col},onChange(col)));
  optChannel.subscribe(()=>{});
}

function body(c){

/* home */
function spark(r){
  const pts=[r.L0,...r.hist.map(h=>h.r)]; if(pts.length<2) return "";
  const W=220,H=46,min=Math.min(...pts)-0.1,max=Math.max(...pts)+0.1;
  const x=i=>i*(W-6)/(pts.length-1)+3, y=v=>H-3-(v-min)/(max-min)*(H-6);
  const d=pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Level history"><line x1="0" x2="${W}" y1="${y(r.L0)}" y2="${y(r.L0)}" stroke="var(--line)" stroke-dasharray="3 3"/><path d="${d}" fill="none" stroke="var(--court)" stroke-width="2"/><circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="3.5" fill="var(--ball)"/></svg>`;
}
function ratingPanel(c,pid,withLeagues=true){
  const r=c.R[pid]; if(!r) return "";
  const myLeagues=Object.values(S.data.leagues).filter(l=>leagueMembers(l).includes(pid));
  const li=myLeagues.map(l=>({l,idx:percentileIndex(leagueMembers(l),c.R)[pid]}));
  return `<div class="rating">
      <div><p class="eyebrow">Weighted level</p><div class="big">${r.r.toFixed(2)}<small> /10</small></div>${spark(r)}</div>
      <div class="factors">
        <div class="factor"><p class="eyebrow">Starting level</p><div class="v">${r.L0.toFixed(1)}</div><p class="muted" style="font-size:.78rem">${r.resetDone?`Reset ${fmtDate(iso(new Date(r.reset.at)))}`:"Self-assessed"}</p></div>
        <div class="factor accent"><p class="eyebrow">Result factor</p><div class="v ${r.res>=0?"pos":"neg"}">${sign(r.res)}</div><p class="muted" style="font-size:.78rem">Wins/losses vs expected</p></div>
        <div class="factor accent"><p class="eyebrow">Margin factor</p><div class="v ${r.mar>=0?"pos":"neg"}">${sign(r.mar)}</div><p class="muted" style="font-size:.78rem">How much you won or lost by</p></div>
        ${r.adj?`<div class="factor"><p class="eyebrow">Organiser nudges</p><div class="v ${r.adj>=0?"pos":"neg"}">${sign(r.adj,0)}</div><p class="muted" style="font-size:.78rem">${(S.data.levels[pid]?.nudges||[]).length} adjustment${(S.data.levels[pid]?.nudges||[]).length===1?"":"s"}</p></div>`:""}
        <div class="factor"><p class="eyebrow">Evidence</p><div class="v">${r.n}</div><p class="muted" style="font-size:.78rem">Matches${r.resetDone?" since reset":""} · ${Math.round(r.conf*100)}% confidence</p></div>
        ${c.club[pid]!=null?`<div class="factor ball"><p class="eyebrow">Club index</p><div class="v">${c.club[pid].toFixed(1)}</div><p class="muted" style="font-size:.78rem">${esc(c.loc?.name||"")} percentile</p></div>`:""}
        ${withLeagues?li.map(x=>`<div class="factor ball"><p class="eyebrow">${esc(x.l.name)}</p><div class="v">${x.idx!=null?x.idx.toFixed(1):"—"}</div><p class="muted" style="font-size:.78rem">League index</p></div>`).join(""):""}
      </div></div>`;
}

function gameStandings(g){

    add(cc.a,sa,sb); add(cc.b,sb,sa); }); });
  const rows=Object.values(t);
  if(pointsFmt(g)) rows.sort((a,b)=>b.pf-a.pf || (b.pf-b.pa)-(a.pf-a.pa) || b.w-a.w);

const audioReady = () => !!AC && AC.state==="running";
function tone(t0,freq,dur,vol=0.25,type="square"){ const o=AC.createOscillator(), gn=AC.createGain(); o.type=type; o.frequency.value=freq;
  gn.gain.setValueAtTime(0.0001,t0); gn.gain.exponentialRampToValueAtTime(vol,t0+0.02); gn.gain.setValueAtTime(vol,t0+dur-0.05); gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn).connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02); }
function buzzer(){ if(!SOUND.on||!audioReady()) return; const t=AC.currentTime+0.05;
  [0,0.3,0.6].forEach(d=>tone(t+d,880,0.18)); tone(t+0.95,660,1.1,0.3,"sawtooth"); }
function soundButton(){ const lab = !SOUND.on ? "🔕 Buzzer off" : audioReady() ? "🔔 Buzzer on" : "🔔 Tap to allow buzzer";
  return `<button class="btn small" data-act="toggleSound" style="align-self:center" title="Plays a buzzer on this device when the match clock reaches zero">${lab}</button>`; }
function roundClock(g,rd,ri,org){
  const total=(sessionPlan(g).match||0)*60;
  const state = rd.startedAt ? `data-round="${rd.startedAt+total*1000}"` : `data-roundpaused="${rd.pausedLeft ?? total}"`;
  return `<div class="clock ${rd.startedAt?"live":""}" ${state}><span class="eyebrow">Round ${ri+1} · ${sessionPlan(g).match} min match</span><span class="t">--:--</span>
    ${org?`<span class="row" style="gap:6px;margin-top:4px">${rd.startedAt?`<button class="btn small" data-act="timerPause" data-g="${esc(g.id)}" data-v="${ri}">Pause</button>`:`<button class="btn small" data-act="timerStart" data-g="${esc(g.id)}" data-v="${ri}">${rd.pausedLeft!=null&&rd.pausedLeft<total?"Resume":"Start"}</button>`}<button class="btn small" data-act="timerReset" data-g="${esc(g.id)}" data-v="${ri}">Reset</button></span>`:""}</div>`;
}

/* rankings */
function rankings(c){
  const ps=playersAt(c.loc.id).map(p=>c.R[p.id]).filter(Boolean).sort((a,b)=>b.r-a.r);
  return `<div class="row between"><h1>Rankings · ${esc(c.loc.name)}</h1></div>
  <div class="tw"><table><thead><tr><th>#</th><th>Player</th><th class="r">Starting</th><th class="r">Result factor</th><th class="r">Margin factor</th><th class="r">Weighted level</th><th class="r">Club index</th><th class="r">Matches</th><th class="r">W–L</th></tr></thead>
  <tbody>${ps.map((r,i)=>`<tr class="click" data-act="openPlayer" data-v="${esc(r.id)}"><td class="num">${i+1}</td><td>${avatar(r.id,22)} ${esc(pname(r.id))}${r.id===meId()?" (you)":""}</td><td class="r num">${r.L0.toFixed(1)}</td><td class="r num ${r.res>=0?"pos":"neg"}">${sign(r.res)}</td><td class="r num ${r.mar>=0?"pos":"neg"}">${sign(r.mar)}</td><td class="r num"><b>${r.r.toFixed(2)}</b></td><td class="r num">${c.club[r.id]?.toFixed(1)??"—"}</td><td class="r num">${r.n}</td><td class="r num">${r.w}–${r.l}</td></tr>`).join("")}</tbody></table></div>
  <details class="panel"><summary>How levels are calculated</summary>
    <div class="stack" style="max-width:68ch;font-size:.92rem">
      <p><b>Starting level</b> is what each player entered when they signed up (1–10). Every match then adjusts it.</p>
      <p>Before each match the system works out the <b>expected result</b> from the two pairs' average levels: equal pairs are 50/50, a 1-level gap makes the stronger pair about 64% favourites, a 2-level gap about 76%.</p>
      <p><b>Result factor</b> moves you by half the step size × (actual result − expected). Beat a stronger pair and you gain a lot; lose to a weaker pair and you drop a lot. <b>Margin factor</b> does the same with your share of the points, so a 9–7 loss costs far less than 2–14.</p>
      <p>The <b>step size</b> starts at 0.9 levels and shrinks as you play (about 0.44 after 10 matches, 0.27 after 30), so new players settle quickly and established levels stay steady. <b>Weighted level</b> = starting level + result factor + margin factor, kept between 1 and 10. It is the level used to balance pairs.</p>
      <p>Organisers can <b>nudge</b> a player's level up or down by one, which keeps all their results. Only the admin can <b>reset</b> a starting level, which sets the result and margin factors back to 0.</p>
      <p>When an established player plays at a club that's new to them, their first 5 matches there use a wider step, so their level settles quickly against the new club's players.</p>
      <p><b>Club index</b> and <b>league index</b> rank you against everyone at the club, or in the league, on a 1–10 scale: the top player is 10, the bottom 1.</p>
    </div></details>`;
}

/* timers */
function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return (h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(s).padStart(2,"0"); }
function tick(){
  const now=Date.now();
  document.querySelectorAll("[data-session]").forEach(el=>{ const [a,b]=el.dataset.session.split("|").map(Number); const t=el.querySelector(".t"), lab=el.querySelector(".eyebrow");
    if(now<a){ const s=(a-now)/1000; lab.textContent="Session starts in"; t.textContent= s>86400? Math.floor(s/86400)+"d "+fmtClock(s%86400).slice(0,-3) : fmtClock(s); el.classList.remove("live"); }
    else if(now<b){ lab.textContent="Session ends in"; t.textContent=fmtClock((b-now)/1000); el.classList.add("live"); }
    else { lab.textContent="Session"; t.textContent="Finished"; el.classList.remove("live"); } });
  document.querySelectorAll("[data-round]").forEach(el=>{ const end=+el.dataset.round, left=(end-now)/1000;
    const prev=tick.last[end]; tick.last[end]=left;
    if(prev!=null && prev>0 && left<=0 && now-end<5000 && !tick.fired.has(end)){ tick.fired.add(end); buzzer(); } el.querySelector(".t").textContent= left>0? fmtClock(left) : "Time!"; el.classList.toggle("over",left<=0); el.classList.toggle("live",left>0); });
  document.querySelectorAll("[data-roundpaused]").forEach(el=>{ el.querySelector(".t").textContent=fmtClock(+el.dataset.roundpaused); });
}
tick.last={}; tick.fired=new Set();
setInterval(tick,500);

  async copyLink(v){ const g=S.data.games[v]; const link=gameLink(g); try{ await navigator.clipboard.writeText(link); toast("Link copied"); }catch(e){ toast(link); } },
  async sendChat(v){ const body=String(D().chatDraft?.[v]||"").trim(); if(!body) return; if(body.length>1000) return toast("Keep messages under 1,000 characters.");
    if(S.mode==="sample"){ (S.chat[v] ||= []).push({id:rid(),game_id:v,author:meId(),body,created_at:new Date().toISOString()}); D().chatDraft[v]=""; return; }
    const {data,error}=await sb.from("game_messages").insert({game_id:v, body}).select().single();
    if(error) return toast(dbError(error)); D().chatDraft[v]=""; const list=(S.chat[v] ||= []); if(!list.some(m=>m.id===data.id)) list.push(data); },
  async delChat(v,el){ const gid=el.dataset.g; if(S.mode!=="sample"){ const {error}=await sb.from("game_messages").delete().eq("id",v); if(error) return toast(dbError(error)); }
    S.chat[gid]=(S.chat[gid]||[]).filter(m=>m.id!==v); },
  async uploadPhoto(v,el){ const pid=el.dataset.v, file=el.files&&el.files[0]; if(!file) return;
    if(file.size>15e6) return toast("That photo is too large. Choose one under 15 MB.");
    let blob; try{ blob=await resizeImage(file); }catch(e){ return toast(e.message); }
    let url;
    if(S.mode==="sample"){ url=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); }); }
    else { const path=`${pid}/${Date.now()}.jpg`; const {error}=await sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg",upsert:true});
      if(error) return toast(/bucket|not found/i.test(error.message)?"Photo storage isn't switched on yet.":"Couldn't upload the photo: "+error.message);
      url=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl; }
    const pl=clone(S.data.players[pid]); pl.photo=url; if(await put("players",pid,pl)) toast("Photo saved"); },
  async removePhoto(v){ const pl=clone(S.data.players[v]); delete pl.photo; await put("players",v,pl); },
  openScore(v){ S.ui.modal={type:"score",key:v}; },
  scoreTap(v){ const k=S.ui.modal.key; const [gid,ri,ci]=k.split(":"); const cc=S.data.games[gid].rounds[+ri].courts[+ci]; const sc=S.ui.scores[k] ||= {};
    const cur=+(sc[v] ?? cc[v] ?? 0)||0; sc[v]=String(cur+1); const o=v==="sa"?"sb":"sa"; if(sc[o]==null) sc[o]=String(+(cc[o]??0)||0); try{ navigator.vibrate&&navigator.vibrate(15); }catch(e){} },
  scoreUndo(v){ const k=S.ui.modal.key; const [gid,ri,ci]=k.split(":"); const cc=S.data.games[gid].rounds[+ri].courts[+ci]; const sc=S.ui.scores[k] ||= {};
    const cur=+(sc[v] ?? cc[v] ?? 0)||0; sc[v]=String(Math.max(0,cur-1)); },
  editRound(v,el){ S.ui.editRound=`${el.dataset.g}:${v}`; },
  cancelEdit(v,el){ const g=S.data.games[el.dataset.g]; (g?.rounds?.[+v]?.courts||[]).forEach((_,ci)=>delete S.ui.scores[`${el.dataset.g}:${v}:${ci}`]); S.ui.editRound=null; },
  async saveCorrection(v,el){ const g=curGame(el.dataset.g); const ri=+v; const rd=g.rounds[ri]; let changed=0;
    for(let ci=0;ci<rd.courts.length;ci++){ const k=`${g.id}:${ri}:${ci}`; const s=S.ui.scores[k]||{}; const cc=rd.courts[ci];
      const sa=s.sa ?? cc.sa, sb=s.sb ?? cc.sb; if(sa===""||sb===""||sa==null||sb==null||isNaN(+sa)||isNaN(+sb)||(+sa)+(+sb)<=0) return toast(`Enter both scores for court ${cc.court}.`);
      if(+sa!==+cc.sa||+sb!==+cc.sb){ if(!cc.prev) cc.prev={sa:cc.sa,sb:cc.sb}; cc.sa=+sa; cc.sb=+sb; changed++; if(cc.prev.sa===cc.sa&&cc.prev.sb===cc.sb) delete cc.prev; } }
    if(!changed){ A.cancelEdit(v,el); return toast("No scores changed."); }
    rd.editedAt=Date.now(); rd.editedBy=meId();
    if(await put("games",g.id,g)){ rd.courts.forEach((_,ci)=>delete S.ui.scores[`${g.id}:${ri}:${ci}`]); S.ui.editRound=null; toast(`Round ${ri+1} corrected · ${changed} court${changed>1?"s":""} changed, levels updated`); } },
  async redrawNext(v,el){ const g=curGame(el.dataset.g); const ri=+v; if(g.rounds.slice(ri+1).some(r=>r.done)) return toast("A later round already has scores.");
    const c=ctx(); const keep=g.rounds.slice(0,ri+1); const rd=planRound(g,eligibleRoster(g),c.R,keep); rd.drawnAt=Date.now(); g.rounds=[...keep,rd];
    if(await put("games",g.id,g)) toast(`Round ${ri+2} re-drawn from the corrected scores`); },
  async timerStart(v,el){ const g=curGame(el.dataset.g); const rd=g.rounds[+v]; const total=sessionPlan(g).match*60; const left=rd.pausedLeft ?? total; rd.startedAt=Date.now()-(total-left)*1000; rd.pausedLeft=null; await put("games",g.id,g); },
  async timerPause(v,el){ const g=curGame(el.dataset.g); const rd=g.rounds[+v]; rd.pausedLeft=Math.max(0,Math.round((rd.startedAt+sessionPlan(g).match*60000-Date.now())/1000)); rd.startedAt=null; await put("games",g.id,g); },
  async timerReset(v,el){ const g=curGame(el.dataset.g); const rd=g.rounds[+v]; rd.startedAt=null; rd.pausedLeft=null; await put("games",g.id,g); },
  newLeague(){ const loc=curLoc(); D().league={id:null,locId:loc.id,name:"",minStart:0,minWeighted:0,minIndex:0,minGames:0,from:today(),to:addDays(today(),90),winPts:3,drawPts:1,lossPts:0,rules:"",picks:[],removed:[]}; S.ui.view={type:"leagueEdit",id:null}; },
  editLeague(v){ D().league=clone(S.data.leagues[v]); S.ui.view={type:"leagueEdit",id:v}; },
  async saveLeague(){ const l=clone(D().league); if(!l.name.trim()) return toast("Name the league."); if(l.from&&l.to&&l.from>l.to) return toast("The start date is after the end date.");
    ["minStart","minWeighted","minIndex","minGames","winPts","drawPts","lossPts"].forEach(k=>l[k]=+l[k]||0);
    const isNew=!l.id; if(isNew){ l.id="lg-"+rid(); l.createdAt=Date.now(); }
    if(await put("leagues",l.id,l)){ S.ui.view={type:"league",id:l.id}; toast(isNew?"League created":"League saved"); } },
  async deleteLeague(v){ if(S.ui.confirm!=="dell-"+v){ S.ui.confirm="dell-"+v; return; } S.ui.confirm=null; await remove("leagues",v); S.ui.view=null; },
  async joinLeague(v){ const s=signup(meId()); if(!s.leagues.includes(v)) s.leagues.push(v); if(await put("signups",meId(),s)) toast("You've joined the league"); },
  async leaveLeague(v){ const s=signup(meId()); s.leagues=s.leagues.filter(x=>x!==v); await put("signups",meId(),s); },
  async leagueAdd(v,el){ const l=clone(S.data.leagues[el.dataset.g]); l.picks=[...new Set([...(l.picks||[]),v])]; l.removed=(l.removed||[]).filter(x=>x!==v); await put("leagues",l.id,l); },
  async leagueRemove(v,el){ const l=clone(S.data.leagues[el.dataset.g]); l.picks=(l.picks||[]).filter(x=>x!==v); l.removed=[...new Set([...(l.removed||[]),v])]; await put("leagues",l.id,l); },
  adminTab(v){ S.ui.adminTab=v; },
  setOnboard(v){ D().prof.path=v; if(v==="organiser" && D().prof.reqLoc==="") D().prof.reqLoc=locs()[0]?.id||"__new"; },
  openApply(){ delete D().apply; S.ui.modal={type:"apply"}; },
  async submitApply(){ const f=D().apply; const err=applyCheck(f); if(err) return toast(err);
    if(await put("organiser_requests",meId(),applyRecord(f))){ S.ui.modal=null; delete D().apply; toast("Application sent to the admin"); } },
  async withdrawApply(){ await remove("organiser_requests",meId()); },
  async approveApp(v){ const r=clone(S.data.organiser_requests[v]); if(!r) return; const p=S.data.players[v]; let locId=r.locId;
    if(r.newLocation){ locId="loc-"+rid(); const n=Math.max(1,parseInt(r.newLocation.courts)||1);
      if(!(await put("locations",locId,{id:locId,name:r.newLocation.name,courts:Array.from({length:n},(_,i)=>i+1),organiserIds:[v],createdAt:Date.now()}))) return; }
    else { const l=clone(S.data.locations[locId]); if(!l) return toast("That club no longer exists."); l.organiserIds=[...new Set([...(l.organiserIds||[]),v])]; if(!(await put("locations",locId,l))) return; }
    if(p && !(p.locations||[]).includes(locId)){ const pp=clone(p); pp.locations=[...(pp.locations||[]),locId]; await put("players",v,pp); }
    r.status="approved"; r.decidedAt=Date.now(); r.decidedBy=meId(); r.locId=locId;
    if(await put("organiser_requests",v,r)) toast(`${pname(v)} is now an organiser${r.newLocation?` at ${r.newLocation.name}`:""}`); },
  async declineApp(v){ if(S.ui.confirm!=="dec-"+v){ S.ui.confirm="dec-"+v; return; } S.ui.confirm=null; const r=clone(S.data.organiser_requests[v]); if(!r) return;
    r.status="declined"; r.decidedAt=Date.now(); r.decidedBy=meId(); if(await put("organiser_requests",v,r)) toast("Application declined"); },
  async toggleOrg(v,el){ const l=clone(S.data.locations[el.dataset.g]); const on=(l.organiserIds||[]).includes(v); l.organiserIds=on? l.organiserIds.filter(x=>x!==v) : [...(l.organiserIds||[]),v]; if(await put("locations",l.id,l)) toast(on?"Organiser removed":`${pname(v)} is now an organiser`); },
  async toggleLive(){ const st=settings(); st.membershipLive=!st.membershipLive; if(await put("settings","app",st)) toast(st.membershipLive?"Live membership is on":"Live membership is off"); },
  async savePricing(){ const st=settings(); st.price=Math.max(0,+D().set.price||0); st.trialDays=Math.max(0,parseInt(D().set.trialDays)||0); if(await put("settings","app",st)) toast("Pricing saved"); },
  async addDisc(){ const f=D().disc; const code=f.code.trim().toUpperCase().replace(/\s+/g,""); const pct=+f.pct; if(!code) return toast("Add a code."); if(!(pct>0&&pct<=100)) return toast("Use a discount between 1 and 100%.");
    const st=settings(); st.discounts=[...(st.discounts||[]).filter(x=>x.code!==code),{code,pct,expires:f.expires||""}]; if(await put("settings","app",st)){ D().disc={code:"",pct:"10",expires:""}; toast("Code added"); } },
  async removeDisc(v){ const st=settings(); st.discounts=(st.discounts||[]).filter((_,i)=>i!==+v); await put("settings","app",st); },
  async recordPay(v){ const st=settings(); const code=D().pay?.[v]||""; const disc=(st.discounts||[]).find(x=>x.code===code); const amount=st.price*(1-(disc?.pct||0)/100);
    const m=clone(S.data.memberships[v]||{history:[]}); const start = (m.status==="active"&&m.until&&m.until>=today())? m.until : today();
    m.status="active"; m.paidOn=today(); m.until=addDays(start,365); m.history=[{date:today(),amount:Math.round(amount*100)/100,code},...(m.history||[])].slice(0,20);
    if(await put("memberships",v,m)) toast(`${money(amount)} recorded for ${pname(v)}`); },
  async startTrial(v){ const st=settings(); const m=clone(S.data.memberships[v]||{history:[]}); m.status="trial"; m.until=addDays(today(),st.trialDays||30); if(await put("memberships",v,m)) toast(`Trial started, ends ${fmtDate(m.until)}`); },
  async setMem(v,el){ const m=clone(S.data.memberships[v]||{history:[]}); m.status=el.dataset.g; m.until= el.dataset.g==="comp"? addDays(today(),365) : m.until; if(el.dataset.g==="none") m.until=""; await put("memberships",v,m); },
  bgClose(v,el,ev){ if(ev.target===el) A.closeModal(); }
};

document.addEventListener("click",async ev=>{
  if(!ev.target.closest('[data-act="toggleSound"]')) unlockAudio();
  const el=ev.target.closest("[data-act]"); if(!el||el.disabled) return;
  const fn=A[el.dataset.act]; if(!fn) return;
  if(el.dataset.act!=="bgClose") ev.stopPropagation();
  if(el.tagName==="BUTTON"&&el.closest("form")) ev.preventDefault();
  if(!/^(deleteGame|clearRounds|deleteLeague|declineApp)$/.test(el.dataset.act)) S.ui.confirm=null;
  await fn(el.dataset.v,el,ev); schedule();
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset.bind){ if(el.type==="radio"){ if(el.checked) setPath(el.dataset.bind,el.value); } else setPath(el.dataset.bind,el.value); }
  if(el.dataset.bindBool!=null) setPath(el.dataset.bindBool,el.checked);
  if(el.dataset.bindArr){ const cur=(getPath(el.dataset.bindArr)||[]).slice(); const v=el.dataset.num!=null?+el.value:el.value; const i=cur.indexOf(v);
    if(el.checked&&i<0) cur.push(v); if(!el.checked&&i>=0) cur.splice(i,1); setPath(el.dataset.bindArr,el.dataset.num!=null?cur.sort((a,b)=>a-b):cur); }
  if(el.dataset.score){ const k=el.dataset.score; S.ui.scores[k]={...(S.ui.scores[k]||{}),[el.dataset.side]:el.value}; }
  if(el.dataset.live!=null) schedule();
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.actChange&&A[el.dataset.actChange]){ A[el.dataset.actChange](el.value,el); schedule(); return; }
  if(el.dataset.time!=null){ const t=normTime(el.value); if(t){ el.value=t; setPath(el.dataset.bind,t); } }
  if(el.dataset.rerender!=null||el.type==="radio"||el.type==="checkbox") schedule();
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&S.ui.modal){ A.closeModal(); schedule(); } });

/* ---------- boot ---------- */
function readGameLink(){ const m=/^#g-([A-Za-z0-9_-]+)$/.exec(location.hash||""); if(m){ try{ sessionStorage.setItem("courtside-open",m[1]); }catch(e){} return m[1]; }
  try{ return sessionStorage.getItem("courtside-open"); }catch(e){ return null; } }
function openPendingGame(){ const id=S.pendingGame; if(!id) return; if(S.data.games[id]){ S.ui.tab="games"; S.ui.view={type:"game",id}; }
  S.pendingGame=null; try{ sessionStorage.removeItem("courtside-open"); }catch(e){} }
async function boot(){
  S.pendingGame=readGameLink();
  render();
  if(!window.supabase || !CFG.supabaseUrl || /YOUR-/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)){ S.mode="setup"; schedule(); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  S.dbAvailable=true;
  const {data:{session}} = await sb.auth.getSession();
  applySession(session);
  sb.auth.onAuthStateChange((ev,session)=>{
    const had=S.me.id; applySession(session);
    if(session && !had && S.mode!=="sample") startLive();
    if(!session){ if(liveChannel){ sb.removeChannel(liveChannel); liveChannel=null; } signedIn=false; if(S.mode!=="sample"){ S.data=emptyData(); S.mode="signedout"; } schedule(); }
  });
  if(session) startLive(); else { S.mode="signedout"; schedule(); }
}
window.__padel = {planRound, computeRatings, capacity, percentileIndex, S, loadSample, allMatches, eligibleRoster, leagueChecks, ctx};
boot();
})();
</script>
